<script>/* Original pixel artwork. Every shape is drawn locally; no image requests. */

 const cache=new Map();
 function rng(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
 function render(canvas,type='city',variant=0){
  const model=state.draft||state.player||{tech:'limitless',body:'eyes'};const key=type+':'+variant+':'+model.tech+':'+model.body;

  canvas.width=480;canvas.height=240;

  const r=rng(173+variant*111+type.length*791);

  function lantern(x,y){rect(x-3,y,7,3,'#191723');rect(x-2,y+3,5,9,'#e8a07d');rect(x-1,y+4,2,7,'#f6c58d');rect(x-3,y+12,7,2,'#292030');rect(x,y+14,1,18,'#201b2b');for(let i=0;i<17;i++)rect(x+(r()-.5)*20,y+r()*20,1,1,'#70404b')}
  function person(x,y,s=1,portrait=false){const tmp=document.createElement('canvas');SorcererArt.draw(tmp,model);c.drawImage(tmp,Math.round(x-20*s),Math.round(y-34*s),Math.round(40*s),Math.round(55*s))}

  const blue=type==='school'||type==='portrait';

function techForRoll(clanId,r){const tier=TIERS.find(t=>r>=t.lo&&r<=t.hi),c=CLANS.find(c=>c.id===clanId);let prefs=[].concat(c?.prefer||[]);const weights=tier.ids.map(id=>[id,prefs.includes(id)?3:1]);let x=(r-tier.lo+.5)/(tier.hi-tier.lo+1)*weights.reduce((n,a)=>n+a[1],0);for(const [id,w]of weights){x-=w;if(x<0)return id}return tier.ids.at(-1)}

function allocate(k){const p=state.draft;if(!p||p.points<=0||!(k in STAT_NAMES)||k==='will'||(isPhysical(p)&&['mp','ctl'].includes(k))||(isEyes(p)&&k==='ctl'))return false;p.stats[k]++;p.allocated[k]=(p.allocated[k]||0)+1;p.points--;return true}
function maxHP(p=state.player){return 70+p.stats.vit*12+(p.level-1)*10}
function maxCE(p=state.player){return isPhysical(p)?0:p.stats.mp*20}

function rank(p=state.player){return GRADES[p.gradeIndex??legacyGrade(p.level)]}

function power(kind='physical',p=state.player){const stat=kind==='tech'?(p.stats.int+p.stats.ctl)/2:p.stats.str;return Math.max(4,Math.round(5+stat*.9+p.level*.8+(kind==='physical'?(p.weapon==='cloud'?9:p.weapon==='blade'?2:5):0)))}

function migrateV1(old){if(!old||old.v!==1||!Array.isArray(old.log)||!Array.isArray(old.cleared))throw Error('지원하지 않는 구버전 저장');const result=fresh();if(!old.player)return result;const o=old.player;

 const line=(points,col,w=3)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke()},ring=(x,y,r,col,w=2)=>{c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.ellipse(x,y,r,r*.65,0,0,Math.PI*2);c.stroke()},rect=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
 return new Promise(resolve=>{const start=performance.now();let impacted=false;function frame(now){const t=Math.min(1,(now-start)/duration),q=Math.min(1,t/.62);c.clearRect(0,0,960,360);c.globalAlpha=Math.min(1,t*10)*Math.min(1,(1-t)*8);

  else if(physical||black){const x=240+Math.min(1,q*1.6)*440;for(let i=0;i<7;i++)line([[x-150-i*9,180+i*11],[x+12,180+i*7]],i%2?color:'#eff4f9',i%3+1);if(q>.45){ring(705,200,(q-.45)*220,color,5);for(let i=0;i<10;i++){const a=i*.628;line([[700+Math.cos(a)*20,200+Math.sin(a)*20],[700+Math.cos(a)*85,200+Math.sin(a)*85]],color,black?5:2)}}}

 openModal(`<div class="battle-shell" style="--energy:${SorcererArt.accent(p)}"><div class="battle-masthead"><span>EXORCISM / ${esc(m.name)}</span><span>WAVE ${f.wave+1}/${m.enemies.length} <b>TURN ${String(f.turn).padStart(2,'0')}</b></span></div><div class="combat-layout"><section class="battle-field">${arenaMarkup(e,p)}<div class="battle-readout"><div class="combat-info"><div><div class="eyebrow">HOSTILE / PHASE ${f.phase}</div><h2 id="modal-title">${esc(e.name)} <small>Lv.${e.level||SHIKIGAMI.find(s=>s.id===f.quest)?.lv||1} · ${e.grade||'조복'}</small></h2></div><span class="enemy-seal" aria-hidden="true">呪</span></div>${bar('주령 체력',f.hp,e.hp,'hp')}<div class="enemy-intent"><span>다음 행동</span>${it.text}</div><div class="combat-bars"><div>${bar('체력 HP',p.hp,maxHP(),'hp')}</div><div>${bar('주력 MP',p.ce,maxCE())}</div></div><div class="combat-flags">${[[f.coffin,'관 '+f.coffin],[f.charge,'전하 '+f.charge],[f.enemyDomain,'상대 영역 '+f.enemyDomain+'턴'],[f.simple,'간이영역 '+f.simple+'턴'],[f.domain,'영역 '+f.domain+'턴'],[f.burnout,'용단 '+f.burnout+'턴'],[f.poison,'독'],[f.curseSeed,'주력의 씨앗'],[f.healBlock,'회복 봉쇄 '+f.healBlock+'턴'],[f.blackFocus,'각성 +3'],[f.manifest,'리카 '+f.manifest+'초'],[f.jackpot,'잭팟 '+f.jackpot+'초']].filter(x=>x[0]).map(x=>`<span class="pill">${x[1]}</span>`).join('')}</div>${r?`<div class="dice-check ${r.success?'success':'fail'}"><strong>${r.n}</strong><div><span>${r.label}</span><small>1d20 ${r.n} ${r.mod>=0?'+':''}${r.mod} = ${r.total} / DC ${r.dc} · ${r.success?'성공':'실패'}</small></div></div>`:'<div class="battle-hint">전조를 읽고, 술식 또는 체술을 선택하세요.</div>'}<div class="battle-log" role="log" aria-live="polite">${f.logs.slice(-7).map(l=>`<p>${esc(l)}</p>`).join('')}</div></div></section><section class="battle-command">${f.pending?reactions:combatActionsMarkup()+`<div class="vow-bar"><span>속박 / BINDING VOW</span>${button(f.revealed?'술식 공개 완료':'술식 공개 +15%','vow','text-btn',`data-vow="reveal" ${f.revealed||f.vow||isPhysical()||p.tech==='none'?'disabled':''}`)}${button('방어 포기 ×1.35','vow','text-btn',`data-vow="risk" ${f.vow?'disabled':''}`)}${button('주력 절반 공양 ×1.6','vow','text-btn',`data-vow="reserve" ${f.vow||isPhysical()||p.ce<10?'disabled':''}`)}</div>${f.vow?'<p class="small gold">적용 중: '+({reveal:'술식 공개',risk:'방어 포기',reserve:'주력 절반 공양'}[f.vow.id])+'</p>':''}`}<div class="battle-bottom"><span>행동과 반격까지 1턴 = 30초</span>${button('철수 ↗','retreat','text-btn')}</div><details class="battle-dossier"><summary>술사 상태·해금 기술</summary>${statusMarkup(p,true)}</details></section></div></div>`,'fight');const log=$('.battle-log');log.scrollTop=log.scrollHeight;
}

function renderModelGallery(){const cards=(title,items)=>`<section class="model-section"><div class="section-title"><h2>${title}</h2><span class="eyebrow">${items.length} MODELS</span></div><div class="model-grid">${items.map(m=>`<article class="model-card"><div class="model-stage"><canvas data-actor="model" ${m.attr} role="img" aria-label="${esc(m.name)} 픽셀 모델"></canvas></div><small>${m.tag}</small><h3>${m.name}</h3></article>`).join('')}</div></section>`;
 $('#main').innerHTML=header('주술사와 저주의 형상','술사 · 주령 · 보스 · 식신을 직접 그린 픽셀 도감입니다.','PIXEL ARCHIVE / 64 × 88')+`<div class="codex-tabs">${[['rules','확률·체질·판정'],['tech','가문·술식'],['enemies','주령·보스'],['models','픽셀 모델']].map(([id,n])=>button(n,'codex',id==='models'?'btn':'btn ghost',`data-tab="${id}"`)).join('')}</div><div class="intro-strip">고전 제복, 주구, 결인, 술식별 상징을 픽셀로 표현했습니다. 네임드 보스는 각자의 고유 외형을 사용합니다. 실제 술사의 모습에는 술식과 특수 체질이 함께 반영됩니다.</div>`+cards('술식별 술사',Object.entries(TECHS).map(([id,t])=>({name:t.name,tag:t.tier+' / SORCERER',attr:`data-model-tech="${id}"`})))+cards('특수 체질',[{name:'육안 · 무하한',tag:'SIX EYES',attr:'data-model-tech="limitless" data-model-body="eyes"'},{name:'천여주박 · 육체',tag:'HEAVENLY RESTRICTION',attr:'data-model-tech="none" data-model-body="physical"'},{name:'완전한 주술의 육체',tag:'FOUR ARMS',attr:'data-model-tech="shrine" data-model-body="perfect"'}])+cards('주령과 네임드 보스',Object.entries(ENEMIES).map(([id,e])=>({name:e.name,tag:e.grade,attr:`data-model-enemy="${id}" data-model-tech="none"`})))+cards('십종영법술 · 조복 식신',SHIKIGAMI.map(s=>({name:s.name,tag:'SHIKIGAMI / Lv.'+s.lv,attr:`data-model-familiar="${s.id}" data-model-tech="shadows"`})));
 SorcererArt.paint($('#main'));
}

const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAGES=[['home','임무 본부'],['missions','임무 게시판'],['training','수련장'],['techniques','주술 도감'],['growth','환생·승급'],['records','나의 기록']];
const ICONS={home:'<path d="m3 10 9-7 9 7v11H3Z M9 21v-8h6v8"/>',missions:'<path d="m5 3 16 16-2 2L3 5V3Z M16 3h5v5 M21 3 4 20"/>',training:'<path d="M12 2c3 5-2 7 2 10 1-3 3-3 3-6 8 9 3 16-5 16S1 14 5 9c0 5 4 5 4 1 0-3 1-6 3-8Z"/>',techniques:'<path d="M4 4h6l2 2 2-2h6v16h-6l-2 2-2-2H4Z M12 6v16"/>',records:'<path d="M6 2h12v20H6Z M9 6h6 M9 10h6 M9 14h6 M9 18h4"/>'};
let codexTab='rules';
function button(label,act,cls='btn',extra=''){return `<button class="${cls}" data-act="${act}" ${extra}>${label}</button>`}
function art(type,label,variant=0){if(type==='portrait')return `<canvas data-actor="portrait" class="pixel" role="img" aria-label="${esc(label)}"></canvas>`;return `<canvas class="pixel" data-art="${type}" data-variant="${variant}" role="img" aria-label="${label}"></canvas>`}
function bar(label,n,max,type=''){return `<div class="meter-label"><span>${label}</span><strong>${n} / ${max}</strong></div><div class="bar ${type}" role="meter" aria-label="${label}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${Math.max(1,max)}"><span style="width:${max?Math.min(100,Math.max(0,n/max*100)):0}%"></span></div>`}
function toast(msg){const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('visible'),3800)}
function beep(type='click'){if(!soundOn)return;try{audioCtx||=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(type==='win'?660:330,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+.2);g.gain.setValueAtTime(.04,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.22);o.start();o.stop(audioCtx.currentTime+.23)}catch{soundOn=false}}
function header(title,desc,kicker='JUJUTSU RPG / RULESET 2.4'){return `<div class="page-heading"><div class="eyebrow">${kicker}</div></div><div class="page-heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="day-tag">DAY ${String(state.player?.day||1).padStart(2,'0')} · 東京</div></div>`}
function modalHeader(title,sub=''){return `<div class="modal-header"><div><div class="eyebrow">${sub}</div><h2 id="modal-title">${title}</h2></div>${button('×','close','close-btn','aria-label="닫기"')}</div>`}
function openModal(html,kind){if(!$('#modal').open)lastFocus=document.activeElement;modalKind=kind;$('#modal').dataset.kind=kind;$('#modal-body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();PixelArt.paint($('#modal'));SorcererArt.paint($('#modal'));}
function closeModal(){if(rollBusy)return;if(state.fight){showFight();return}$('#modal').close();modalKind='';if(lastFocus?.isConnected)lastFocus.focus()}
function empty(){return `<section class="panel empty-state"><div class="roll-seal">呪</div><h2>운명의 주사위가 기다립니다.</h2><p>이름을 정하고, 네 번의 1d100으로 당신의 주술사를 생성하세요.</p>${button('캐릭터 생성 →','gacha')}</section>`}
function statGrid(p){return `<div class="stats-grid">${Object.entries(STAT_NAMES).map(([k,name])=>`<div><span>${name}</span><strong>${k==='ctl'&&isEyes(p)?'MAX':p.stats[k]}</strong></div>`).join('')}</div>`}
function statusMarkup(p,compact=false){if(!p)return '';return `<section class="status-sheet ${compact?'compact':''}"><div class="status-title"><b>${esc(p.name)} · Lv.${p.level}</b><span>${esc(p.affiliation||'도쿄 주술고전')} / ${clanOf(p).name} / ${rank(p)}</span></div><div class="status-facts"><p><b>신체 체질</b> ${bodyOf(p).name}</p><p><b>보유 술식</b> ${isPhysical(p)?'술식 없음':TECHS[p.tech].name} · ${subSkills(p).map(esc).join(' / ')}</p></div>${inheritanceMarkup(p)}${masteryMarkup(p)}${statGrid(p)}<p class="status-detail"><b>환생·승급</b> 환생 ${state.rebirthCount||0}회 · 기본 스탯 +${(state.rebirthCount||0)*2} · 임무 ${p.missionCount||0}회 · 상위 토벌 ${p.eliteKills||0}체</p><p class="status-detail"><b>습득 기술</b> ${skillList(p).join(' · ')}</p>${p.devEdited?'<p class="small muted">개발자 조정 기록 있음 · 최초 뽑기 주사위는 변경되지 않습니다.</p>':''}<p class="status-detail"><b>주구·소지품</b> ${WEAPONS[p.weapon]} · 회복 부적 ${p.charms} · 해독 ${p.antidotes} · 혈액팩 ${p.bloodpacks} · 주전 ${p.gold} · 손가락 ${p.fingers}/20</p>${p.scorn?'<p class="small muted">젠인 가문 멸시: 최초 3회 수련 비용 25% 증가.</p>':''}</section>`}
function characterPanel(){const p=state.player;return `<section class="panel character-panel"><div class="panel-title">술사 기록 <span class="pill">${p?rank():'미등록'}</span></div><div class="character"><div class="avatar">${art('portrait','주술사 픽셀 초상화')}</div><div><small>${p?'LEVEL '+p.level:'1d100 × 4'}</small><h3>${p?esc(p.name):'이름 없는 술사'}</h3><p>${p?clanOf().name:'혈통 · 체질 · 주력 · 술식'}</p></div></div>${p?bar('체력 HP',p.hp,maxHP(),'hp')+bar('주력 MP',p.ce,maxCE())+bar('경험치',p.xp,threshold(),'xp'):'<p class="empty-char">천여주박부터 육안까지.<br>네 번의 주사위가 새로운 운명을 만듭니다.</p>'}<div class="stat-list"><div class="stat-row"><span>체질</span><strong>${p?bodyOf().name:'미정'}</strong></div><div class="stat-row"><span>생득술식</span><strong>${p?isPhysical()?'없음':TECHS[p.tech].name:'미정'}</strong></div><div class="stat-row"><span>각성의 단서</span><strong>${p?p.insight:0}</strong></div></div>${button(p?'상태창 펼치기':'운명의 주사위 굴리기',p?'status':'gacha','btn secondary full')}${p?button('휴식 · 전부 회복','rest','btn ghost full'):''}</section>`}
function missionCard(m,i){const ok=available(i),done=state.cleared.includes(i);return `<article class="mission ${ok?'':'locked'}"><div class="mission-art">${art(m.art,m.location+' 픽셀 풍경',i)}<span class="mission-grade">${m.grade}</span></div><div class="mission-body"><span class="mission-index">FILE / ${String(i+1).padStart(2,'0')}</span><h3>${m.name}</h3><p>${m.location}<br>${ENEMIES[m.enemies.at(-1)].name}</p><div class="mission-meta"><span>Lv.${m.level} · ${m.enemies.length}연전</span><span class="gold">◈ ${m.gold}</span></div>${button((ok?(done?'다시 출격':'임무 확인'):!state.player?'술사 등록 필요':i>0&&!state.cleared.includes(i-1)?'이전 임무 완료 필요':`Lv.${m.level} 필요`)+' <span>↗</span>','mission',ok?'btn secondary':'btn ghost',`data-id="${i}" ${ok?'':'disabled'}`)}</div></article>`}
function renderHome(){const p=state.player,n=nextMission(),first=p?Math.min(n,12):0;$('#main').innerHTML=`<div class="chapter-line"><span><i></i> RULESET 2.4 ／ 운명의 주사위</span><span>기록 ${String(state.cleared.length).padStart(2,'0')} / 15</span></div><section class="domain-hero"><div class="domain-art">${art('domain','붉은 달과 푸른 주력의 주술사')}</div><div class="hero-grain"></div><div class="domain-copy"><div class="episode"><span>${p?'CHAPTER '+String(n+1).padStart(2,'0'):'1d100 × 4'}</span>${p?MISSIONS[n].name:'혈통 · 체질 · 주력 · 생득술식'}</div><h1>${state.ending?'저주의 끝에서,<br><em>이름을 남기다.</em>':'저주를 삼키고,<br><em>운명을 뒤집어라.</em>'}</h1><p>${p?`${bodyOf().name} · ${isPhysical()?'술식 없는 육체':TECHS[p.tech].name}<br>${MISSIONS[n].location}에서 새로운 주력 반응이 감지되었습니다.`:'주사위 하나가, 모든 것을 바꾼다.<br>천여주박의 육체인가, 육안의 기적인가.'}</p><div class="hero-buttons">${button(p?'임무에 출격하다 ↗':'캐릭터 생성 ↗',p?'board':'gacha','btn primary')}${button('판정 규칙 ＋','help','hero-link')}</div><span class="hero-footnote">d20 판정 · 속박 · 사선의 각성 · 저주의 왕 최종전</span></div><div class="talisman" aria-hidden="true"><span>禁</span><b>封印解除</b><small>急急如律令</small></div><div class="hero-kanji" aria-hidden="true">呪</div><div class="hero-scene-label"><span>帳 — THE VEIL</span><span>東京・23:59</span></div></section><div class="warning-strip"><strong>주력 반응 감지</strong><span>포창신 · 재앙의 주령 · 사멸회유 · 료멘스쿠나</span><b>최종 위협 <em>宿儺</em></b></div><div class="home-grid"><section><div class="section-title"><div><span class="eyebrow">EXORCISM OPERATIONS</span><h2>퇴마 임무 <small>祓除任務</small></h2></div>${button('전체 15개 임무 ↗','board','text-btn')}</div><div class="missions">${MISSIONS.slice(first,first+3).map((m,j)=>missionCard(m,first+j)).join('')}</div><div class="field-quote"><span>“</span><p>주술사는, <b>자신의 죽음을 선택할 수 없다.</b><small>적의 전조를 읽고 대응을 선언하세요.</small></p>${button('보스 기믹 보기 ↗','enemy-codex','text-btn')}</div></section><aside class="dossier"><div class="dossier-label"><span>JUJUTSU SORCERER FILE</span><b>機密</b></div>${characterPanel()}</aside></div>${p?statusMarkup(p):''}`}

 $('#nav').innerHTML=PAGES.map(([id,name])=>`<button class="nav-btn ${page===id?'active':''}" data-act="nav" data-page="${id}" ${page===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[id]||ICONS.training}</svg>${name}</button>`).join('');$('#page-label').textContent=PAGES.find(x=>x[0]===page)?.[1]||'임무 본부';$('#main').dataset.page=page;

 if(page==='records')$('#main').innerHTML=header('나의 기록','주사위, 선택, 각성. 모든 발자취가 기록됩니다.')+(state.player?statusMarkup(state.player)+`<section class="panel" style="margin-top:20px"><div class="eyebrow">CREATION DICE</div><p class="muted">${state.player.dice?'가문 / 체질 / 초기 주력 / 생득술식 = '+state.player.dice.join(' / '):'구버전에서 이전한 술사. 생성 주사위를 소급 생성하지 않았습니다.'}</p>${state.ending?button('스쿠나 전투 이후의 기록','ending','btn secondary'):''}${state.log.map(l=>`<div class="log-item"><time>DAY ${l.day}</time><p>${esc(l.text)}</p></div>`).join('')}</section>`:empty());PixelArt.paint();SorcererArt.paint();
}
function oddsMarkup(){return `<div class="rule-tables"><h3>① 가문 · 1d100</h3>${rangeTable(CLANS)}<h3>② 신체·체질 · 1d100</h3>${rangeTable(BODIES)}<h3>③ 초기 주력 · 1d100 (추가 게임 규칙)</h3>${rangeTable(MP_TABLE.map(x=>({...x,name:x.label,desc:'주력 총량 +'+x.add})))}<h3>④ 생득술식 · 1d100</h3><table><thead><tr><th>주사위</th><th>등급</th><th>술식</th></tr></thead><tbody>${TIERS.map(t=>`<tr><td>${t.lo}–${t.hi}</td><td>${t.name}</td><td>${t.ids.map(id=>TECHS[id].name).join(' · ')}</td></tr>`).join('')}</tbody></table><details><summary>가문별 정확한 최종 술식 확률</summary>${CLANS.map(c=>{const counts={};for(let n=1;n<=100;n++){const id=techForRoll(c.id,n);counts[id]=(counts[id]||0)+1}return `<p><b>${c.name}</b><br>${Object.entries(counts).map(([id,n])=>TECHS[id].name+' '+n+'%').join(' · ')}</p>`}).join('')}<p>체질이 육체 천여주박이면 위 표와 관계없이 술식 없음으로 고정됩니다.</p></details><h3>정통 계승과 마스터리</h3><p>고죠–무하한 / 젠인–십종영법술·투사주법 / 카모–적혈조술 / 이누마키–주언 / 스가와라–모방: 피해 +20%, 술식 MP −15%, 숙련도 성장 2배. 술식 사용마다 숙련 1(계승 2), 10마다 마스터리 1레벨. Lv.1~100, 레벨당 피해 +1%·술식 MP −0.2%. 반전·간이영역 비용은 별도입니다.</p><h3>환생과 실적 승급</h3><p>첫 뽑기 10회, 환생마다 +10회. 확정 후 뽑기 금지. 환생 조건 50→100→150…→1000, 이후 1000으로 고정하여 환생 횟수 무제한. 환생마다 기본 스탯 +2, 최대 레벨 1000. 환생·승급 메뉴에서 임무/상위 주령 조건을 확인하세요. 등급은 레벨과 독립입니다.</p><p class="instructions">${RULES_TEXT}</p></div>`}
function rangeTable(list){return `<table><thead><tr><th>주사위</th><th>결과</th><th>효과</th></tr></thead><tbody>${list.map((x,i)=>`<tr><td>${i?list[i-1].end+1:1}–${x.end}</td><td>${x.name}</td><td>${x.desc}</td></tr>`).join('')}</tbody></table>`}
function showGacha(){if(state.player){showStatus();return}if(state.draft){showRollResult();return}openModal(`<div class="modal-content">${modalHeader('당신의 이름부터.','CHARACTER CREATION / 01')}${rollAllowanceMarkup()}<p class="instructions">주술회전 TRPG 세계에 오신 것을 환영합니다.<br>이름을 정하면 가문, 체질, 초기 주력, 생득술식 순서로 운명의 주사위를 굴립니다.</p><label class="field-label" for="player-name">주술사 이름 (1~16자)</label><input id="player-name" type="text" maxlength="16" value="${esc(state.name)}" placeholder="이름 없는 주술사" autocomplete="off"><div class="row" style="margin-top:22px">${button('1d100 네 번 굴리기 →','roll')}</div><details class="odds" style="margin-top:20px"><summary>확률과 판정 규칙 보기</summary>${oddsMarkup()}</details><p class="small muted">최초 뽑기 10회, 환생마다 10회 증가. 운명을 확정하면 다음 환생까지 뽑을 수 없습니다.</p></div>`,'gacha');$('#player-name').focus()}
function doRoll(){if(rollBusy||state.player)return;const input=$('#player-name');state.name=(input?input.value:state.draft?.name||state.name).trim().slice(0,16)||'이름 없는 주술사';if(!rollFate(state.name)){toast('뽑기 횟수를 모두 사용했습니다. 마지막 운명을 확정하세요.');return}rollBusy=true;openModal(`<div class="modal-content">${modalHeader('운명의 주사위가 구른다.','1d100 × 4')}<div class="roll-stage rolling"><div class="roll-seal">呪</div><h3>혈통의 봉인이 풀린다</h3><p>가문 → 체질 → 주력 → 술식</p></div></div>`,'rolling');save();setTimeout(()=>{rollBusy=false;showRollResult();beep('win')},650)}
function showRollResult(){const p=state.draft;if(!p){showGacha();return}const mp=MP_TABLE.find(x=>p.dice[2]<=x.end);openModal(`<div class="modal-content">${modalHeader('운명이 새겨졌다.','CHARACTER CREATION / 02')}${rollAllowanceMarkup()}<div class="dice-reveal">${[['출신 가문',clanOf(p).name],['신체 체질',bodyOf(p).name],['초기 주력',mp.label+' · 기본 +'+p.mpBonus],['생득술식',isPhysical(p)?'폐기 → 술식 없음':TECHS[p.tech].name]].map(([label,name],i)=>`<article><span>${i+1}. ${label}</span><strong>${String(p.dice[i]).padStart(2,'0')}</strong><small>${name}</small></article>`).join('')}</div><div class="intro-strip"><strong>${esc(p.name)} · ${bodyOf(p).name}</strong><br>${bodyOf(p).desc}${isPhysical(p)?'<br>네 번째 주사위는 사용하지 않습니다. MP 0·주술 전부 금지·석혼도 지급.':''}${p.scorn?'<br>젠인 가문 멸시 페널티: 최초 3회 수련 비용 +25%.':''}</div>${inheritanceMarkup(p)}${statGrid(p)}${p.points?`<div class="allocation"><b>일반 가문 자유 분배: ${p.points}점 남음</b><div class="row">${Object.keys(STAT_NAMES).filter(k=>k!=='will').map(k=>button(STAT_NAMES[k]+' +1','allocate','btn ghost',`data-key="${k}" ${(isPhysical(p)&&['mp','ctl'].includes(k))||(isEyes(p)&&k==='ctl')?'disabled':''}`)).join('')}</div></div>`:''}<div class="row" style="margin-top:20px">${button(state.drawsLeft?'다시 굴리기 · '+state.drawsLeft+'회 남음':'뽑기 횟수 소진','roll','btn ghost',canRoll()?'':'disabled')}${button('이 운명으로 등록 →','register','btn',p.points?'disabled':'')}</div><details class="odds" style="margin-top:20px"><summary>확률표 · 가문 보정 · 예외 조건</summary>${oddsMarkup()}</details></div>`,'gacha-result')}
function showStatus(){if(!state.player)return;openModal(`<div class="modal-content">${modalHeader('캐릭터 상태창','SORCERER STATUS')}${statusMarkup(state.player)}${button('확인','close','btn full','style="margin-top:20px"')}</div>`,'status')}
function renderTraining(){const p=state.player;$('#main').innerHTML=header('수련과 각성','사선과 흑섬의 경험이, 아직 닿지 못한 경지를 연다.')+(p?`<div class="intro-strip"><strong>${rank()} / Lv.${p.level}</strong> · ${p.gold} 주전 · 각성의 단서 ${p.insight} · 흑섬 ${p.blackFlashes}회<br>반전술식·영역전개는 레벨만으로 구매할 수 없습니다. 흑섬 또는 사선의 경험이 있어야 각성 연구를 할 수 있습니다.</div><div class="card-grid"><article class="panel study-card"><div class="study-icon">鍛</div><h3>능력 수련</h3><p>선택한 스탯 +1. 최대 30회. 육체 천여주박의 MP와 육안의 MAX 제어는 바뀌지 않습니다.</p><label class="field-label" for="train-stat">수련할 능력</label><select id="train-stat">${['str','agi','vit','int','ctl'].filter(k=>!(k==='ctl'&&(isPhysical()||isEyes()))).map(k=>`<option value="${k}">${STAT_NAMES[k]} · ${p.stats[k]}</option>`).join('')}</select><p class="sub">${trainPrice()} 주전 · ${p.training}/30회</p>${button('수련하기','train','btn secondary',p.gold<trainPrice()||p.training>=30?'disabled':'')}</article>${trainingCard('界','간이영역','가문과 무관하게 익히는 필중 중화. 무술식은 기본 습득.','Lv.3 · 120 주전',p.learned.simple?'습득 완료':'배우기','learn-simple',isPhysical()||p.learned.simple||p.level<3||p.gold<120)}${['reverse','domain'].map(k=>trainingCard(k==='reverse'?'反':'領',k==='reverse'?'반전술식':'영역전개',k==='reverse'?'흑섬·사선의 기억을 연구해 양의 에너지에 도전한다.':'Lv.5, 단서 2개 이상, 생득술식 필요. 술식 용단과 열린 영역에 주의.',`80 주전 · 성공 ${k==='reverse'?30:20}% / 누적 3회째 확정`,p.learned[k]?'각성 완료':'각성 연구','research',isPhysical()||p.learned[k]||p.insight<1||p.gold<80||k==='domain'&&(p.level<5||p.insight<2||p.tech==='none'),`data-skill="${k}"`)).join('')}${trainingCard('符','현장 보급','회복 40% / 해독은 독·씨앗·수몰 제거. 혈액팩은 적혈조술의 출혈을 방지.','회복 30 · 해독 25 · 혈액팩 20 주전','회복 부적 구입','buy',p.gold<30,'data-item="charm"')}<article class="panel study-card"><div class="study-icon">具</div><h3>특급 주구 관리</h3><p>석혼도: 영혼 타격 / 천역모: 결계 해제 / 유운: 물리 위력. 신규 주구는 각 280 주전.</p>${['soulblade','spear','cloud'].map(id=>button(`${p.weapon===id?'장착 중 · ':p.weapons.includes(id)?'장착 · ':'구입 · '}${WEAPONS[id]}`,'equip','btn ghost',`data-item="${id}" ${p.weapon===id||!p.weapons.includes(id)&&p.gold<280?'disabled':''}`)).join('')}</article></div><div class="supply-row">${button('해독 부적 구입 · 25','buy','btn ghost','data-item="antidote"')}${button('혈액팩 구입 · 20','buy','btn ghost','data-item="blood"')}${button('무료 휴식','rest','btn secondary')}</div>${p.tech==='shadows'?tamingMarkup():''}${skillLibrary(p)}${statusMarkup(p)}`:empty())}
function trainingCard(seal,title,desc,sub,label,act,disabled=false,extra=''){return `<article class="panel study-card"><div class="study-icon">${seal}</div><h3>${title}</h3><p>${desc}</p><div class="sub">${sub}</div>${button(label,act,'btn secondary',`${disabled?'disabled':''} ${extra}`)}</article>`}
function tamingMarkup(){const p=state.player;return `<div class="section-title" style="margin-top:30px"><h2>십종영법술 · 단독 조복</h2></div><div class="tech-grid">${SHIKIGAMI.map(s=>`<article class="tech-item"><h3>${s.name}</h3><p>Lv.${s.lv} · ${s.effect}</p><p class="small">${p.destroyed.includes(s.id)?'소멸 · 힘은 다른 식신에게 계승':p.tamed.includes(s.id)?'조복 완료':'미조복'}</p>${button(p.activeShikigami===s.id&&!p.destroyed.includes(s.id)?'동행 중':p.tamed.includes(s.id)?'동행 식신으로 선택':'단독 조복 도전','shikigami','btn ghost',`data-item="${s.id}" ${p.destroyed.includes(s.id)||p.level<s.lv?'disabled':''}`)}</article>`).join('')}</div>`}
function renderCodex(){if(codexTab==='models'){renderModelGallery();return}const tabs=[['rules','확률·체질·판정'],['tech','가문·술식'],['enemies','주령·보스'],['models','픽셀 모델']];$('#main').innerHTML=header('주술 도감','원작 기반 세계관과 사용자가 지정한 규칙을 담은 팬 게임 데이터베이스.')+`<div class="codex-tabs">${tabs.map(([id,label])=>button(label,'codex',id===codexTab?'btn':'btn ghost',`data-tab="${id}"`)).join('')}</div>`+(codexTab==='rules'?`<section class="panel">${oddsMarkup()}</section>`:codexTab==='tech'?`<div class="intro-strip">생득술식은 선천적인 고유 능력, 상전술식은 가문을 통해 이어지는 생득술식입니다. 가문 보정은 획득 확률에 적용됩니다. 가문에 맞는 술식은 정통 계승 보너스(피해 +20%, 술식 MP −15%, 숙련도 성장 ×2)를 받으며 다른 가문도 모든 술식을 얻을 수 있습니다.<br>육안은 술식이 아닌 체질입니다. 미공개 영역·일부 보스 대응 수치는 게임용 창작으로 처리합니다.</div><div class="tech-grid">${Object.entries(TECHS).map(([id,t])=>`<article class="tech-item"><div class="eyebrow">${t.tier} GRADE ${state.player?.tech===id?' / 보유':''}</div><h3>${t.seal} ${t.name}</h3><p>${t.desc}</p><div class="codex-expansions">${EXT_SKILLS[id].map(s=>`<p><b>${s.name}</b><br><small>Lv.${s.level} / 숙련 ${s.mastery} · ${s.desc}</small></p>`).join('')}</div><small>기본 MP ${t.cost} · ${t.contact?'접촉 공격':'원거리/술식'}<br>영역: ${t.domain||'없음'}${['none','shadows','projection','shrine','soul','limitless','copy','jackpot'].includes(id)?'':' (게임 창작)'}</small></article>`).join('')}</div>`:`<div class="intro-strip">모든 네임드는 체력 50%에서 2페이즈. 영역전개 시 자동 전투가 멈추고 맞영역·간이영역·탈출·결계 파괴 중 대응을 선택합니다. 필중도 주력 0·열린 영역·영혼의 윤곽에 따라 다르게 처리됩니다.</div><div class="tech-grid">${Object.values(ENEMIES).map(e=>`<article class="tech-item"><div class="eyebrow">${e.grade} / ${e.kind==='human'?'주저사·수육체':'주령'}</div><h3>${e.name}</h3><p>${e.gimmick}</p><small>체력 ${e.hp} · 기본 DC ${e.dc}<br>${e.domain?'영역: '+e.domain+(e.open?' / 열린 영역':''):e.zero?'주력 0 · 닫힌 영역 필중 면역':'고유 패턴 보유'}</small></article>`).join('')}</div>`)}
function showMission(i){if(!available(i))return;const m=MISSIONS[i];openModal(`<div class="modal-content">${modalHeader(m.name,`MISSION ${i+1} / ${m.grade}`)}<div style="height:160px">${art(m.art,m.location,i)}</div><p class="instructions">${m.intro}</p><div class="odds">${m.enemies.map(id=>`<b>${ENEMIES[id].name}</b> — ${ENEMIES[id].gimmick}`).join('<br>')}<br>보상 ${m.xp} XP / ${m.gold} 주전 · 첫 완료 XP 50% 추가${m.fingers?' / 손가락 '+m.fingers+'개':''}</div><h3 class="plan-heading">GM: 결계에 어떻게 진입합니까?</h3><div class="plan-options">${button('정찰 · 지능 판정으로 적의 약점 파악','start','btn secondary',`data-id="${i}" data-plan="scout"`)}${button('민간인 구출 · 민첩 판정 / 부적 보급','start','btn ghost',`data-id="${i}" data-plan="rescue"`)}${button('정면 돌입 · 체력과 주력 전부 회복','start','btn ghost',`data-id="${i}" data-plan="direct"`)}</div></div>`,'mission')}
function applyPlan(plan){if(plan==='scout'){const r=check('사전 정찰','int',11);if(r.success){state.fight.observed=true;addBattle('약점 파악. 이 적에 대한 판정 +3.')}else addBattle('흔적을 놓쳤지만 안전하게 결계에 진입했다.')}if(plan==='rescue'){const r=check('민간인 구출','agi',11);if(r.success){state.player.charms=Math.min(999,state.player.charms+1);addBattle('민간인을 구출했다. 보조감독에게 회복 부적 1개를 받았다.')}else {state.player.hp-=Math.round(maxHP()*.08);addBattle('민간인은 구했으나 가벼운 상처를 입었다.')}}}
function showResult(r){render();openModal(`<div class="modal-content"><div class="eyebrow">${r.quest?'TAMING RITUAL':'MISSION'} / ${r.win?'COMPLETE':'RETURNED'}</div><div class="result-seal">${r.win?'祓':'歸'}</div><h2 id="modal-title" class="result-title">${r.win?'운명을 넘어섰습니다.':'살아서 돌아온 자의 기록.'}</h2><p class="result-desc">${r.win?r.hunt?'변이 주령을 제령했습니다. 임무 실적과 토벌 보상을 획득했습니다.':r.quest?r.name+' 조복 성공. 새로운 식신이 함께합니다.':MISSIONS[r.mission].outro:'보조감독이 구조했습니다. 주전과 경험치 손실 없이 귀환합니다. 소환 중이던 식신의 소멸 여부는 기록에서 확인하세요.'}</p>${r.win?`<div class="reward-grid"><div><strong>+${r.xp}</strong>경험치</div><div><strong>+${r.gold}</strong>주전</div><div><strong>Lv.${state.player.level}</strong>${rank()}</div></div>`:''}${statusMarkup(state.player,true)}${button(r.ending?'저주의 왕 이후의 기록 →':'본부로 귀환 →',r.ending?'ending':'return','btn full','style="margin-top:20px"')}</div>`,'result');beep(r.win?'win':'click')}
function showEnding(){if(!state.ending)return;openModal(`<div class="modal-content">${modalHeader('제목 없는 주술사','EPILOGUE / SUKUNA DEFEATED')}<div class="ending-art">${art('school','다시 찾아온 주술고전의 아침')}</div><p class="instructions">${esc(state.player.name)}, 당신은 저주의 왕을 넘어섰습니다.<br><br>부서진 결계 위로 새벽이 찾아옵니다. 주사위가 정했던 혈통과 체질보다, 매 순간 당신이 선택했던 행동들이 더 오래 남았습니다.<br><br>주술고전의 기록 마지막 줄.<br>“이름 없는 주술사가, 끝내 살아 돌아왔다.”</p>${statusMarkup(state.player)}${button('이야기를 계속하다','return','btn full','style="margin-top:20px"')}</div>`,'ending')}
function help(){openModal(`<div class="modal-content">${modalHeader('판정과 생존 지침','RULESET 2.4')}<div class="instructions"><p><b>이름 → 1d100 네 번 → 자유 포인트 분배 → 등록</b><br>가문·체질·초기 주력·생득술식을 순서대로 결정합니다. 결과와 정확한 확률은 공개됩니다.</p><p><b>전투는 d20 + 능력 보정 대 DC</b><br>실제 주사위와 보정치를 매턴 표시합니다. 순수 20의 주력 접촉 공격은 흑섬, 무술식은 19~20입니다. 원거리 술식 대성공은 명중이며 흑섬은 아닙니다.</p><p><b>반전과 영역은 각성으로</b><br>흑섬 또는 체력 25% 이하의 사선을 경험하면 단서를 얻고 각성 판정을 합니다. 실패했다면 수련장에서 단서를 연구하세요. 영역은 Lv.5와 단서 2개가 필요합니다.</p><p><b>보스의 전조가 생존을 결정합니다</b><br>영역전개에는 대응창이 열립니다. 포창신의 관은 3카운트 전에 본체 타격, 하나미의 씨앗은 주구 타격, 마히토는 영혼 자각, 카시모는 접지, 스쿠나의 공간 참격은 회피나 영창 방해로 대응합니다.</p><p><b>속박</b><br>술식 공개, 방어 포기, 주력 공양 중 상황에 맞는 대가를 선택하세요. 공개는 1회, 다른 속박은 턴마다 선택 가능합니다. 이 오프라인 게임은 표에 명시된 행동·속박을 판정하는 로컬 GM입니다.</p></div><details class="odds"><summary>전체 확률·추가 판정 규칙</summary>${oddsMarkup()}</details>${button('확인','close','btn full','style="margin-top:20px"')}</div>`,'help')}
function settings(){openModal(`<div class="modal-content">${modalHeader('설정 및 저장','RULESET 2.4 / LOCAL SAVE')}<p class="instructions">현재 브라우저에 자동 저장됩니다. 새로고침·저장 파일 불러오기 시 진행 중인 전투는 보상 없이 중단됩니다.<br>구버전 저장은 이름·가문·술식·레벨·주전·습득 기술을 유지하며 새 캠페인으로 이전합니다. 기존 v1 브라우저 원본은 별도 보존합니다.</p><div class="settings-grid">${button('저장 파일 내보내기 ↓','export','btn secondary')}${button('저장 파일 불러오기 ↑','import','btn secondary')}${button('판정 규칙 보기','help','btn ghost')}${state.developerUnlocked?button('전체 기록 초기화 (개발자)','reset','btn danger'):''}${state.player?button('환생·승급 관리','growth','btn secondary'):''}</div>${developerEntry()}<p class="small muted">제목 없는 주술사 v2.4 · 외부 서버·이미지·API 없는 단일 HTML 팬 게임</p></div>`,'settings')}
function exportSave(){save();const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='제목-없는-주술사-v2-저장.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('저장 파일을 내보냈습니다.')}
function resetPrompt(){openModal(`<div class="modal-content">${modalHeader('새 운명을 시작할까요?','NEW RECORD')}<p class="instructions">현재 v2 캐릭터와 임무 기록을 지우고 다시 생성합니다. 남겨둘 기록은 먼저 저장 파일로 내보내세요. 구버전 v1 원본은 지우지 않습니다.</p><div class="row">${button('기록 내보내기','export','btn secondary')}${button('취소','close','btn ghost')}${button('v2 기록 초기화','reset-confirm','btn danger')}</div></div>`,'reset')}
function handle(action,t){if(combatBusy)return;if(action==='motion'){toggleMotion();return}if(action==='combat-tab'){combatTab=t.dataset.tab;showFight();return}if(action==='skill-preview'){showSkillPreview(t.dataset.skill);return}if(action==='preview-play'){playPreview(t.dataset.skill);return}beep();if(['growth','rebirth','rebirth-confirm','hunt-start'].includes(action)){if(action==='growth')closeModal();handleLifecycle(action);return}if(action.startsWith('dev-')){handleDeveloper(action,t);return}const p=state.player;let message='';switch(action){
 case'nav':page=t.dataset.page;render();window.scrollTo({top:0,behavior:'instant'});break;
 case'board':page='missions';render();break;case'enemy-codex':page='techniques';codexTab='enemies';render();break;
 case'codex':codexTab=t.dataset.tab;renderCodex();break;
 case'gacha':showGacha();break;case'roll':doRoll();break;case'allocate':allocate(t.dataset.key);save();showRollResult();break;
 case'register':if(registerDraft()){save();closeModal();page='home';render();toast('술사 등록 완료. 첫 임무에서 당신의 선택을 선언하세요.')}break;
 case'status':showStatus();break;case'close':closeModal();break;
 case'rest':message=restore()?'체력과 주력이 모두 회복되었습니다.':'전투 중에는 휴식할 수 없습니다.';save();render();toast(message);break;
 case'train':message=trainStat($('#train-stat').value)?'수련을 완료했습니다.':'수련 조건을 확인하세요.';save();render();toast(message);break;
 case'buy':message=purchase(t.dataset.item)?'보급품을 구입했습니다.':'주전 또는 소지 한도를 확인하세요.';save();render();toast(message);break;
 case'equip':message=equipWeapon(t.dataset.item)?'주구를 장착했습니다.':'주전이 부족합니다.';save();render();toast(message);break;
 case'learn-simple':message=learnSimple()?'간이영역을 습득했습니다.':'습득 조건을 확인하세요.';save();render();toast(message);break;
 case'research':{const r=research(t.dataset.skill);save();render();toast(r?`각성 d100 ${r.n} / 기준 ${r.chance} → ${r.success?'해금!':'실패, 다음 연구에 누적됩니다.'}`:'각성 연구 조건을 확인하세요.');break;}
 case'shikigami':if(p.tamed.includes(t.dataset.item)&&!p.destroyed.includes(t.dataset.item)){p.activeShikigami=t.dataset.item;save();render();toast('동행 식신을 변경했습니다.')}else if(startTaming(t.dataset.item)){save();showFight()}break;
 case'mission':showMission(Number(t.dataset.id));break;
 case'start':if(startFight(Number(t.dataset.id))){applyPlan(t.dataset.plan);save();showFight()}break;
 case'vow':if(setVow(t.dataset.vow)){save();showFight()}break;
 case'fight':runCombat(t.dataset.action);break;
 case'retreat':openModal(`<div class="modal-content">${modalHeader('결계에서 철수할까요?','RETREAT')}<p class="instructions">이번 전투의 보상을 받지 않고 귀환합니다. 주전·경험치·식신을 잃지 않습니다.</p><div class="row">${button('전투 계속','resume','btn secondary')}${button('철수하기','retreat-confirm','btn danger')}</div></div>`,'retreat');break;
 case'resume':showFight();break;case'retreat-confirm':state.fight=null;record('스스로 철수를 선택했다. 다음 기회를 준비한다.');save();closeModal();render();break;
 case'return':closeModal();page='home';render();break;case'ending':showEnding();break;
 case'settings':settings();break;case'help':help();break;case'export':exportSave();break;case'import':$('#save-file').click();break;
 case'reset':if(!state.player||state.developerUnlocked)resetPrompt();break;case'reset-confirm':if(state.player&&!state.developerUnlocked)break;state=fresh();save();closeModal();page='home';render();showGacha();break;
 case'sound':soundOn=!soundOn;$('#sound').innerHTML='♫<span>'+(soundOn?'ON':'OFF')+'</span>';$('#sound').setAttribute('aria-label','효과음 '+(soundOn?'끄기':'켜기'));beep();break;
 }}
function init(){load();render();document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='developer-code'){e.preventDefault();handleDeveloper('dev-unlock',e.target)}});document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&!t.disabled)handle(t.dataset.act,t)});$('.brand').addEventListener('click',e=>{e.preventDefault();page='home';render()});$('#modal').addEventListener('cancel',e=>{if(rollBusy||combatBusy||state.fight)e.preventDefault();else modalKind=''});$('#save-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>400000)throw Error('파일이 너무 큽니다.');const next=readSave(await file.text());if(next.player){next.player.hp=maxHP(next.player);next.player.ce=maxCE(next.player)}state=next;save();closeModal();page='home';render();toast('저장 파일을 불러왔습니다.')}catch(err){toast('불러오기 실패: '+err.message)}})}
if(!globalThis.__TEST__)init();
</script>
</body></html>
